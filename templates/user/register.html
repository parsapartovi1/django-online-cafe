{% extends "base.html" %}

{% block title %}ثبت‌نام | Mariba Coffee{% endblock %}

{% block content %}

<style>
    nav.navbar {
        background: #000 !important;
        backdrop-filter: none !important;
        border-bottom: 1px solid rgba(255,255,255,0.15);
    }
</style>

<section class="d-flex justify-content-center align-items-center"
         style="
            min-height: 100vh;
            background-image: url('/static/images/background/8.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 20px;
         ">

    <div class="p-4 shadow-lg"
         style="
            width: 430px;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            box-shadow: 0 0 35px rgba(0,0,0,0.55);
         ">

        <h3 class="text-center mb-4 fw-bold" style="letter-spacing: 1px;">
            ایجاد حساب کاربری
        </h3>

        <form method="POST">
            {% csrf_token %}

            <!-- Phone Number -->
            <div class="mb-3">
                <label class="form-label">شماره تماس</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-warning border-secondary">
                        <i class="bi bi-phone"></i>
                    </span>
                    <input type="text"
                           name="number"
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="مثال: 09123456789">
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">ایمیل</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-warning border-secondary">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email"
                           name="email"
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="you@example.com">
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">رمز عبور</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-warning border-secondary">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password"
                           name="password"
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="رمز عبور">
                </div>
            </div>

            <!-- Repeat Password -->
            <div class="mb-3">
                <label class="form-label">تکرار رمز عبور</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-warning border-secondary">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password"
                           name="password2"
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="تکرار رمز عبور">
                </div>
            </div>

            <button class="btn btn-warning w-100 mt-3 fw-bold py-2"
                    style="border-radius: 10px; font-size: 1.1rem;">
                ثبت‌نام
            </button>

            <p class="text-center mt-3">
                قبلاً حساب ساخته‌اید؟
                <a href="{% url 'user_login' %}" class="text-warning fw-bold">
                    ورود
                </a>
            </p>

        </form>
    </div>
</section>

{% endblock %}
