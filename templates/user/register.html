{% load static %}

<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ثبت‌نام</title>
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>ثبت‌نام</h2>
            <form method="POST" autocomplete="off">  
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="first_name">نام</label>
                    <input type="text" id="first_name" name="first_name" placeholder="نام خود را وارد کنید" required autocomplete="name"> 
                </div>

                <div class="form-group">
                    <label for="last_name">نام خانوادگی</label>
                    <input type="text" id="last_name" name="last_name" placeholder="نام خانوادگی خود را وارد کنید" required autocomplete="family-name"> 
                </div>

                <div class="form-group">
                    <label for="number">شماره تلفن</label>
                    <input type="text" id="number" name="number" placeholder="شماره تلفن خود را وارد کنید" required autocomplete="tel"> 
                </div>

                <div class="form-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" name="password" placeholder="رمز عبور خود را وارد کنید" required autocomplete="new-password"> 

                <button type="submit" class="submit-btn">ثبت‌نام</button>

                <div class="login-link">
                    <p>قبلاً حساب کاربری دارید؟ <a href="{% url 'user_login' %}">ورود به حساب</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
