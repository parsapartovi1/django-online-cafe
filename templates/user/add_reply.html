{% extends "base.html" %}

{% block title %}پاسخ به نظر{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 760px;">
        <div class="card-body p-4 p-md-5">
            <h4 class="mb-4">ثبت پاسخ مدیر</h4>

            <div class="bg-light border rounded p-3 mb-4">
                <div class="small text-muted mb-1">نظر مشتری:</div>
                <p class="mb-0">{{ comment.text }}</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                {% if next_url %}
                    <input type="hidden" name="next" value="{{ next_url }}">
                {% endif %}
                <div class="mb-3">
                    <label for="text" class="form-label">متن پاسخ</label>
                    <textarea class="form-control"
                              id="text"
                              name="text"
                              rows="5"
                              placeholder="پاسخ خود را وارد کنید"
                              required></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">ثبت پاسخ</button>
                    {% if next_url %}
                        <a href="{{ next_url }}" class="btn btn-outline-secondary">بازگشت</a>
                    {% else %}
                        <a href="{% url 'product_detail' comment.product.id %}" class="btn btn-outline-secondary">
                            بازگشت
                        </a>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
