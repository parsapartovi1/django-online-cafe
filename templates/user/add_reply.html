{% load static %}

<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پاسخ به کامنت</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <h2>پاسخ به کامنت</h2>

        
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="text">محتوای پاسخ</label>
                <textarea name="text" id="text" rows="4" placeholder="پاسخ خود را وارد کنید" required></textarea>
            </div>
            <button type="submit">ارسال پاسخ</button>
        </form>

        <br>
        <a href="{% url 'comment_detail' comment.id %}">برگشت به کامنت</a>
    </div>
</body>
</html>
