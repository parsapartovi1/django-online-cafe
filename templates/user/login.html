{% load static %}

<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <h2>ورود به حساب کاربری</h2>
        
        <form method="post" autocomplete="off"> 
            {% csrf_token %}
            
            <div class="form-group">
                <label for="number">شماره تلفن:</label>
                <input type="text" name="number" id="number" placeholder="شماره تلفن خود را وارد کنید" required autocomplete="tel"> 
            </div>

            <div class="form-group">
                <label for="password">رمز عبور:</label>
                <input type="password" name="password" id="password" placeholder="رمز عبور خود را وارد کنید" required autocomplete="current-password"> 
            </div>

            <button type="submit">ورود</button>
        </form>

        <br>
        <div class="register-link">
            <p>حساب کاربری ندارید؟ <a href="{% url 'user_register' %}">ثبت‌نام کنید</a></p>
        </div>
    </div>
</body>
</html>
