<h2>Comment on {{ product.name }}</h2>
<form method="post">
    {% csrf_token %}
    <textarea name="text" placeholder="Write your comment"></textarea><br>
    <input type="number" name="com_rate" min="1" max="5" step="0.1" placeholder="Rate 1-5"><br>
    <button type="submit">Submit</button>
</form>
