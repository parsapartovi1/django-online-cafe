{% load static %}
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">
    <title>{% block title %}Maribra Coffee{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
<style>
    body, input, button, a, label {
        font-family: 'Vazir', sans-serif !important;
    }
</style>
    {% block extra_css %}{% endblock %}

</head>

<script>
document.addEventListener("DOMContentLoaded", function () {

    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();

        hours = hours < 10 ? "0" + hours : hours;
        minutes = minutes < 10 ? "0" + minutes : minutes;

        const clock = document.getElementById("clock");
        if (clock) {
            clock.textContent = hours + ":" + minutes;
        }
    }

    updateClock();
    setInterval(updateClock, 1000);

});
</script>


<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm px-4" style="background-color: transparent;">
    <div class="container-fluid">

        <!-- Brand -->
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'home' %}">
            <img src="{% static 'images/brand_label.png' %}"
                 alt="Mariba Logo"
                 width="80"
                 height="80"
                 class="me-2">
            Mariba Coffee | قهوه ماریبا
        </a>

        <!-- Toggle button -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Center Links -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'product_list' %}">
                        منو قهوه ماریبا
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'category-list' %}">
                        دسته‌بندی‌ها
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'discount-list' %}">
                        تخفیف‌ها
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'table_reservation' %}">
                        رزرو میز
                    </a>
                </li>

            </ul>
        </div>

        <!-- Right Side (Clock + Icons) -->
        <div class="d-flex align-items-center">

            <!-- Clock Rectangle -->
            <div class="nav-clock me-3 px-3 py-2">
                <span id="clock">00:00</span>
            </div>

            <!-- User -->
            <a href="{% url 'user_register' %}" class="me-3">
                <img src="{% static 'images/nav_access/3.png' %}"
                     alt="User"
                     width="40"
                     height="40"
                     class="rounded-circle">
            </a>

            <!-- Cart -->
            <a href="{% url 'order-list' %}" class="me-3">
                <img src="{% static 'images/nav_access/22.png' %}"

                     height="30">
            </a>

            <!-- Music player -->
              <a href="{% url 'music_page' %}" class="me-3">
                <img src="{% static 'images/nav_access/1000.png' %}"

                     width="30"
                     height="30">
              </a>

            <!-- Working Shifts -->
            <a href="{% url 'list_working_shifts' %}">
                <img src="{% static 'images/nav_access/444.png' %}"
                     alt="Clock"
                     width="30"
                     height="30">
            </a>

        </div>

    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid p-0">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
