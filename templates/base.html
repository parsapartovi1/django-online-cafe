<script>
document.addEventListener("DOMContentLoaded", function () {

    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();

        hours = hours < 10 ? "0" + hours : hours;
        minutes = minutes < 10 ? "0" + minutes : minutes;

        const clock = document.getElementById("clock");
        if (clock) {
            clock.textContent = hours + ":" + minutes;
        }
    }

    updateClock();
    setInterval(updateClock, 1000);

});
</script>

<div class="music-player">
    <img id="cover" src="{% static 'images/music_img' %}" class="cover" alt="">

    <audio id="audio" >
        <source id="audio-source" src="{% static 'music' %}" type="audio/mpeg">
    </audio>

    <div class="music-info">
        <h3 id="musicTitle"></h3>
        <p id="musicArtist"></p>
    </div>

    <div class="controls">
        <button onclick="prevSong()">⏭</button>
        <button onclick="togglePlay()" id="playBtn">▶︎</button>
        <button onclick="nextSong()">⏮</button>
    </div>


</div>
</body>
<script>
const songs = [
    {
        title: "Tiramisu",
        artist: "Don Toliver",
        src: "{% static 'music/Don Toliver - Tiramisu.mp3' %}",
        cover: "{% static 'images/music_img/1.jpg' %}"
    },
    {
        title: "No Pole",
        artist: "Don Toliver",
        src: "{% static 'music/Don Toliver - No Pole.mp3' %}",
        cover: "{% static 'images/music_img/2.jpg' %}"
    }
];

let currentSong = 0;

const audio = document.getElementById("audio");
const source = document.getElementById("audio-source");
const cover = document.getElementById("cover");
const title = document.getElementById("musicTitle");
const artist = document.getElementById("musicArtist");
const playBtn = document.getElementById("playBtn");

function loadSong(index) {
    source.src = songs[index].src;
    cover.src = songs[index].cover;
    title.textContent = songs[index].title;
    artist.textContent = songs[index].artist;
    audio.load();
}

function togglePlay() {
    if (audio.paused) {
        audio.play();
        cover.classList.add("spin");
        playBtn.innerText = "❚❚";
    } else {
        audio.pause();
        cover.classList.remove("spin");
        playBtn.innerText = "▶︎";
    }
}

function nextSong() {
    currentSong = (currentSong + 1) % songs.length;
    loadSong(currentSong);
    audio.play();
    cover.classList.add("spin");
    playBtn.innerText = "❚❚";
}

function prevSong() {
    currentSong = (currentSong - 1 + songs.length) % songs.length;
    loadSong(currentSong);
    audio.play();
    cover.classList.add("spin");
    playBtn.innerText = "❚❚";
}

// Load first song on page load
loadSong(currentSong);
</script>
