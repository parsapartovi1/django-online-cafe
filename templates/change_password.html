{% extends "base.html" %}

{% block title %}تغییر رمز عبور | Mariba Coffee{% endblock %}

{% block content %}

<style>
    nav.navbar {
        background: #000 !important;
        border-bottom: 1px solid rgba(255,255,255,0.15);
    }
</style>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">

<style>
    * {
        font-family: 'Vazir', sans-serif !important;
    }

    .change-container {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(16px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.20);
        padding: 30px;
        color: #fff;
        box-shadow: 0 0 45px rgba(0,0,0,0.65);
    }

    .form-field {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px;
        padding: 12px 16px;
        color: #fff;
        margin-bottom: 18px;
        width: 100%;
    }

    .submit-btn {
        background: #f1c40f;
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        width: 100%;
        font-weight: bold;
        color: #000;
        font-size: 1rem;
        margin-top: 10px;
    }

    .title {
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 20px;
        text-align: center;
        color: #f1c40f;
    }
</style>

<section class="d-flex justify-content-center align-items-center"
         style="
            min-height: 100vh;
            background-image: url('/static/images/background/15.jpg');
            background-size: cover;
            background-position: center;
            padding: 10px;
         ">

    <div class="change-container">

        <div class="title">تغییر رمز عبور</div>

        <!-- پیام‌ها -->
        {% if messages %}
            {% for message in messages %}
                <div style="
                    background: rgba(46, 204, 113, 0.25);
                    border: 1px solid rgba(46, 204, 113, 0.45);
                    padding: 12px 16px;
                    border-radius: 10px;
                    color: #2ecc71;
                    margin-bottom: 15px;
                    font-weight: bold;
                    text-align: center;
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label class="form-label">رمز فعلی</label>
            <input type="password" name="old_password" class="form-field" placeholder="رمز فعلی را وارد کنید">

            <label class="form-label">رمز جدید</label>
            <input type="password" name="new_password1" class="form-field" placeholder="رمز جدید">

            <label class="form-label">تکرار رمز جدید</label>
            <input type="password" name="new_password2" class="form-field" placeholder="تکرار رمز جدید">

            <button type="submit" class="submit-btn">تغییر رمز</button>
        </form>

    </div>

</section>

{% endblock %}
