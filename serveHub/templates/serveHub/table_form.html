<!-- templates/serveHub/table_form.html -->
<!DOCTYPE html>
<html>
<head>
    <title>{% if object %}Edit{% else %}Add{% endif %} Table</title>
</head>
<body>
    <h1>{% if object %}Edit Table #{{ object.table_number }}{% else %}Add New Table{% endif %}</h1>
    
    <form method="post">
        {% csrf_token %}
        
        {% if form.table_number.errors %}
        <p style="color: red;">
            {{ form.table_number.errors }}
        </p>
        {% endif %}
        
        <p>
            <label>Table Number:</label><br>
            <input type="number" name="table_number" value="{{ object.table_number|default:'' }}" required min="1">
        </p>
        
        <p>
            <label>Capacity (persons):</label><br>
            <input type="number" name="capacity" value="{{ object.capacity|default:'' }}" required min="1">
        </p>
        
        <p>
            <label>Reservation Duration (minutes):</label><br>
            <input type="number" name="duration" value="{{ object.duration|default:'' }}" required min="15">
        </p>
        
        <p>
            <label>Price ($):</label><br>
            <input type="number" name="price" step="0.01" value="{{ object.price|default:'' }}" required min="0">
        </p>
        
        <p>
            <button type="submit">Save Table</button>
            <a href="/tables/">Cancel</a>
        </p>
    </form>
</body>
</html>
